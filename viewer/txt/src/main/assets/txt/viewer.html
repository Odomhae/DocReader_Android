<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #fff; }
    /* pre-wrap keeps the file's own line breaks and spacing but never scrolls sideways. */
    #viewer {
      margin: 0;
      padding: 16px;
      color: #212121;
      font: 16px/1.6 sans-serif;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
