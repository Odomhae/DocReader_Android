<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  window.result = null;
  fetch('/document/current')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    })
    .then(function (buffer) {
      var bytes = new Uint8Array(buffer);
      // Sample the content rather than hashing 25 MB in JS: the bytes follow a known pattern.
      var samples = [0, 1, 255, 256, 1048576, bytes.length - 1].map(function (i) { return bytes[i]; });
      window.result = { length: bytes.length, samples: samples };
    })
    .catch(function (e) { window.result = { error: String(e.message || e) }; });
</script>
</body>
</html>
