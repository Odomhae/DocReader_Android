<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Only probes whose outcome differs between "blocked" and "reached the network" are used:
  // a cross-origin fetch or XHR fails either way because of CORS, so it would prove nothing.
  function probeImage(url) {
    return new Promise(function (resolve) {
      var image = new Image();
      image.onload = function () { resolve('image:loaded'); };
      image.onerror = function () { resolve('image:failed'); };
      image.src = url;
    });
  }
  function probeScript(url) {
    return new Promise(function (resolve) {
      var script = document.createElement('script');
      script.onload = function () { resolve('script:loaded'); };
      script.onerror = function () { resolve('script:failed'); };
      script.src = url;
      document.head.appendChild(script);
    });
  }
  window.result = null;
  Promise.all([
    probeImage('https://www.google.com/favicon.ico'),
    probeScript('https://www.gstatic.com/charts/loader.js'),
    fetch('/assets/webhost/host.js').then(function (r) { return 'asset:' + r.status; }),
  ]).then(function (results) { window.result = results; });
</script>
</body>
</html>
