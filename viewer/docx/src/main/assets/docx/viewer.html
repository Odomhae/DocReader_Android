<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; background: #9e9e9e; }
    /* docx-preview's wrapper centres pages on a wide grey margin; a phone has no room for that. */
    .docx-wrapper { padding: 8px !important; background: #9e9e9e !important; align-items: flex-start !important; box-sizing: content-box; }
    .docx-wrapper > section.docx { margin-bottom: 8px !important; box-shadow: 0 1px 4px rgba(0, 0, 0, .4) !important; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <!-- Classic scripts: both libraries are UMD bundles. docx-preview expects the JSZip global. -->
  <script src="lib/jszip.min.js"></script>
  <script src="lib/docx-preview.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
